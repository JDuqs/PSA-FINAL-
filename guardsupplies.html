<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Security Guard - Supplies Tracking | PSA</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- REQUIRED: SUPABASE SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        body { 
            background-color: #f4f7f9; 
            min-height: 100vh; 
            display: flex; 
            flex-direction: column;
            font-family: 'Segoe UI', sans-serif; 
        }
        
        /* HEADER STYLES - Security Guard Theme */
        .guard-header {
            background-color: #28a745; /* Green for Security */
            color: white;
            border-bottom: 5px solid #ffc107; /* PSA Yellow */
            padding: 15px 0;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        /* MAIN CONTENT CENTERING */
        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        /* CARD STYLES */
        .login-card { 
            width: 100%;
            max-width: 400px; 
            padding: 30px; 
            border-radius: 12px; 
            background: white; 
            box-shadow: 0 10px 30px rgba(40, 167, 69, 0.1); /* Green shadow */
            border-top: 4px solid #28a745;
        }
        
        .card-header-guard { 
            margin-bottom: 25px; 
            padding-bottom: 15px; 
            border-bottom: 1px solid #eee;
        }

        .btn-success { 
            background-color: #28a745; 
            border: none; 
            font-weight: bold; 
            padding: 12px; 
            transition: all 0.3s ease;
        }
        .btn-success:hover { 
            background-color: #218838; 
            transform: translateY(-1px);
        }
        .form-control:focus {
            border-color: #28a745;
            box-shadow: 0 0 0 0.25rem rgba(40, 167, 69, 0.15);
        }

        /* FOOTER STYLES */
        .psa-footer {
            background-color: white;
            border-top: 1px solid #e0e0e0;
            padding: 20px 0;
            font-size: 0.85rem;
            color: #444;
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <!-- GUARD HEADER -->
    <header class="guard-header w-100">
        <div class="container d-flex align-items-center">
            <i class="fas fa-shield-alt fa-3x me-3" style="color: #ffc107;"></i>
            <div class="text-start">
                <small class="d-block text-uppercase fw-bold" style="letter-spacing: 1px; font-size: 0.75rem; opacity: 0.9;">Security Division</small>
                <h4 class="m-0 fw-bold">Supplies Tracking Portal</h4>
            </div>
        </div>
    </header>

    <!-- MAIN CONTENT (Centered Login Card) -->
    <main>
        <div class="login-card text-center">
            <div class="card-header-guard">
                <h4 style="color: #28a745; font-weight: bold; margin: 0;">Security Guard Login</h4>
                <small class="text-muted d-block mt-1">Track OUT / Process Returns</small>
            </div>
            
    <form id="guardLoginForm">
        <script type="module">
            document.addEventListener('DOMContentLoaded', () => {
                document.getElementById('guardLoginForm').addEventListener('submit', (e) => {
                    e.preventDefault();
                    window.handleGuardLogin(e);
                });
            });
        </script>
                <div class="text-start mb-3">
                    <label class="form-label fw-bold small text-secondary">GUARD ID / EMAIL</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0"><i class="fas fa-user-shield text-muted"></i></span>
                        <input type="email" id="guardEmail" class="form-control border-start-0 ps-0" value="guard1@test.com" required autocomplete="username">
                    </div>
                </div>
                <div class="text-start mb-4">
                    <label class="form-label fw-bold small text-secondary">PASSWORD</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0"><i class="fa fa-lock text-muted"></i></span>
                        <input type="password" id="guardPassword" class="form-control border-start-0 ps-0" required autocomplete="current-password">
                    </div>
                </div>
                <button type="submit" id="guardLoginBtn" class="btn btn-success w-100 mb-3 shadow-sm">ACCESS SUPPLIES TRACKING</button>
            </form>

            <div class="text-center border-top pt-3">
                <a href="index.html" class="small text-decoration-none text-primary fw-bold">← Back to Main PSA Login</a>
            </div>
            <p id="guardErrorMsg" class="text-danger mt-3 small fw-bold"></p>
        </div>
    </main>

    <!-- PSA FOOTER -->
    <footer class="psa-footer w-100 text-center">
        <div class="container">
            <p class="mb-0">Philippine Statistics Authority - Security Supplies Portal</p>
        </div>
    </footer>

    <script type="module" src="app.js"></script>
</body>
</html>
